version: "3.9"

# ═══════════════════════════════════════════════════════════════════
#  APEX CODING AGENT — Production Stack
# ═══════════════════════════════════════════════════════════════════

services:
  # ── Core API Server ─────────────────────────────────────────────
  apex-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex-api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./workspace:/app/workspace
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker sandbox
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - apex-net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  # ── Redis — State Store + Cache + Pub/Sub ───────────────────────
  redis:
    image: redis:7-alpine
    container_name: apex-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apex-net

  # ── Prometheus — Metrics Collection ─────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: apex-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - apex-net

  # ── Grafana — Dashboards ────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: apex-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=apex-admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - apex-net

  # ── Jaeger — Distributed Tracing ────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: apex-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - apex-net

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  apex-net:
    driver: bridge
